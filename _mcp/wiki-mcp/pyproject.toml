[project]
name = "wiki-mcp"
version = "0.1.0"
description = "Read-only local MCP server for curated Markdown wiki knowledge."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.28,<2",
  "PyYAML>=6.0",
]

[project.scripts]
wiki-mcp = "wiki_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_mcp"]
