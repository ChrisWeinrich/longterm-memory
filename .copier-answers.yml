project_description: Kustos is a curated, local-first knowledge keeper for assistants,
    research, decisions, and durable personal knowledge.
project_name: Kustos
project_slug: kustos
wiki_mcp_discover_description: Describe Kustos’s policy, frontmatter schema, document
    types, observed tags, collections, and authority rules.
wiki_mcp_get_description: Get one Kustos page by server-issued ID. File paths are
    never accepted; drafts are non-authoritative.
wiki_mcp_get_moc_description: Get Kustos’s Map of Context; use this first when you
    need project orientation.
wiki_mcp_handshake: Use Kustos to orient yourself in this project and find curated
    knowledge. When you do not know where to start, call wiki_get_moc first. Then
    use wiki_discover or wiki_index, and search and retrieve only the context you
    need. Accepted Kustos pages are authoritative; drafts require explicit opt-in
    and are always unreviewed.
wiki_mcp_index_description: Return Kustos’s active navigation index and compact metadata
    for accepted, curated pages.
wiki_mcp_index_resource_description: Kustos’s accepted navigation entry point for
    curated knowledge.
wiki_mcp_log_resource_description: Kustos’s maintenance log for material changes to
    curated knowledge.
wiki_mcp_schema_resource_description: Kustos’s frontmatter schema, status meanings,
    and authority policy.
wiki_mcp_search_description: Search accepted Kustos pages using simple, explainable
    case-insensitive text matching. Drafts require explicit opt-in and are always
    unreviewed.
wiki_mcp_submit_note_description: Save externally supplied context in Kustos’s Raw
    external queue for later human curation.
